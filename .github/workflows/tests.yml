name: Tests and Linting

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -e ".[dev]"

    - name: Lint with Ruff
      run: ruff check .

    - name: Type check with mypy
      run: mypy --explicit-package-bases models/ utils/ scripts/

    - name: Test with pytest and coverage
      run: pytest tests/

  docs:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'

    - name: Install documentation dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -e ".[docs]"

    - name: Regenerate API reference pages
      run: |
        python docs/generate_api_docs.py

    - name: Check committed API docs are up to date
      run: |
        git diff --exit-code -- docs/source/api

    - name: Build Sphinx documentation
      run: |
        cd docs
        make html SPHINXOPTS="-W --keep-going"
