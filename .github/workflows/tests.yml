name: Tests and Linting

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Install uv
      uses: astral-sh/setup-uv@v7

    - name: Install locked dependencies
      run: |
        uv sync --locked --all-extras
        echo "$PWD/.venv/bin" >> "$GITHUB_PATH"

    - name: Check requirements.txt matches uv.lock
      run: |
        diff <(grep -v '^ *#' requirements.txt) \
             <(uv export --frozen --all-extras --no-hashes --no-emit-project | grep -v '^ *#')

    - name: Lint with Ruff
      run: ruff check .

    - name: Type check with mypy
      run: mypy --explicit-package-bases models/ utils/ scripts/

    - name: Test with pytest and coverage
      run: pytest tests/

  docs:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Install uv
      uses: astral-sh/setup-uv@v7

    - name: Install locked dependencies
      run: |
        uv sync --locked --all-extras
        echo "$PWD/.venv/bin" >> "$GITHUB_PATH"

    - name: Regenerate API reference pages
      run: |
        python docs/generate_api_docs.py

    - name: Check committed API docs are up to date
      run: |
        git diff --exit-code -- docs/source/api

    - name: Build Sphinx documentation
      run: |
        cd docs
        make html SPHINXOPTS="-W --keep-going"
