name: Documentation

on:
  push:
    branches: [ master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-docs:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'

    - name: Install system dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y pandoc

    - name: Install locked dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install -e . --no-deps

    - name: Regenerate API reference pages
      run: |
        python docs/generate_api_docs.py

    - name: Check committed API docs are up to date
      run: |
        git diff --exit-code -- docs/source/api

    - name: Validate docs markdown links
      run: |
        python docs/check_markdown_links.py

    - name: Build documentation
      run: |
        cd docs
        make html SPHINXOPTS="-W --keep-going"

    - name: Enable GitHub Pages static asset serving
      run: |
        touch docs/_build/html/.nojekyll

    - name: Deploy to GitHub Pages
      uses: JamesIves/github-pages-deploy-action@v4
      with:
        folder: docs/_build/html
        branch: gh-pages
