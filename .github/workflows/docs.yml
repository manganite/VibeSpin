name: Documentation

on:
  push:
    branches: [ master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-docs:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -e ".[docs]"

    - name: Regenerate API reference pages
      run: |
        python docs/generate_api_docs.py

    - name: Check committed API docs are up to date
      run: |
        git diff --exit-code -- docs/source/api

    - name: Build documentation
      run: |
        cd docs
        make html SPHINXOPTS="-W --keep-going"

    - name: Deploy to GitHub Pages
      uses: JamesIves/github-pages-deploy-action@v4
      with:
        folder: docs/_build/html
        branch: gh-pages
