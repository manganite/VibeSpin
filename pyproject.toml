[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "vibespin"
version = "0.1.0"
description = "Vibe-coded simulation of statistical mechanics spin models: A Vibe-Coded Journey through Statistical Mechanics"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "numpy",
    "matplotlib",
    "tqdm",
    "numba",
    "scipy",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "pytest-cov",
    "ruff",
    "mypy",
]
notebook = [
    "ipykernel",
    "notebook",
    "ipywidgets",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["models*", "utils*", "scripts*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = "test_*.py"
addopts = "-ra --showlocals --cov=models --cov=utils --cov-report=term-missing"

[tool.coverage.run]
branch = true
source = ["models", "utils"]

[tool.coverage.report]
show_missing = true
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "if __name__ == .__main__.:",
    "raise NotImplementedError",
    "if TYPE_CHECKING:",
    "@abstractmethod",
]

[tool.ruff]
# Target Python version (matches local .venv / Python 3.12)
target-version = "py312"
line-length = 100

[tool.ruff.lint]
# Enable specific rule sets:
# E/W (Pycodestyle), F (Pyflakes), I (Isort), UP (Pyupgrade), B (Bugbear)
select = ["E", "W", "F", "I", "UP", "B"]
ignore = []

[tool.ruff.format]
quote-style = "single"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"

[tool.mypy]
python_version = "3.12"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
disallow_untyped_decorators = false
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_no_return = true
warn_unreachable = true
strict_equality = true
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "models.*"
# Numba functions often return 'Any' in mypy's eyes, causing no-any-return errors
warn_return_any = false
disable_error_code = ["no-any-return"]
