[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "multiferroic"
version = "0.1.0"
description = "High-performance Monte Carlo simulation framework for 2D lattice models"
requires-python = ">=3.9"
dependencies = [
    "numpy",
    "matplotlib",
    "tqdm",
    "numba",
    "pytest",
    "ruff",
    "mypy",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["models*", "utils*", "scripts*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = "test_*.py"
addopts = "-ra --showlocals"

[tool.ruff]
# Target Python version
target-version = "py314"
line-length = 100

[tool.ruff.lint]
# Enable specific rule sets:
# E/W (Pycodestyle), F (Pyflakes), I (Isort), UP (Pyupgrade), B (Bugbear)
select = ["E", "W", "F", "I", "UP", "B"]
ignore = []

[tool.ruff.format]
quote-style = "single"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"

[tool.mypy]
python_version = "3.14"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
disallow_untyped_decorators = false
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_no_return = true
warn_unreachable = true
strict_equality = true
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "models.*"
# Numba functions often return 'Any' in mypy's eyes, causing no-any-return errors
warn_return_any = false
disable_error_code = ["no-any-return"]
