repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.15.0
    hooks:
      - id: ruff-check

  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: v1.18.2
    hooks:
      - id: mypy
        args: [--explicit-package-bases, models/, utils/, scripts/]
        pass_filenames: false
        additional_dependencies:
          - numpy
          - matplotlib
          - tqdm
          - numba
          - scipy

  - repo: local
    hooks:
      - id: docs-markdown-links
        name: docs markdown link guard
        entry: .venv/bin/python docs/check_markdown_links.py
        language: system
        pass_filenames: false
        stages: [pre-commit, pre-push]

      - id: sphinx-api-docs-sync
        name: sphinx api docs sync
        entry: bash -lc '.venv/bin/python docs/generate_api_docs.py && git diff --exit-code -- docs/source/api'
        language: system
        pass_filenames: false
        stages: [pre-commit, pre-push]

      - id: sphinx-html-warnings
        name: sphinx html warnings guard
        entry: bash -lc 'cd docs && make html SPHINXOPTS="-W --keep-going"'
        language: system
        pass_filenames: false
        stages: [pre-push]

      - id: pytest-docstring-style
        name: pytest docstring style guard
        entry: .venv/bin/pytest -q tests/test_docstring_style.py
        language: system
        pass_filenames: false
        stages: [pre-commit]

      - id: pytest
        name: pytest
        entry: .venv/bin/pytest
        language: system
        pass_filenames: false
        stages: [pre-push]